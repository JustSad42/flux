[package]
name = "flux"
version = "1.2.3"
edition = "2021"

[lib]
name = "flux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
webview2-com = "0.39"   # same version Tauri uses: tell WebView2 when the window is hidden in the tray
windows-core = "0.62"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_IO", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# smaller, faster flux.exe (slower to build)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
